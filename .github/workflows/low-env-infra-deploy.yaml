name: low-env-pipeline

on:
  push:
    branches:
      - 'main'
      - 'pipeline'
    # paths:
    #   - 'infra/**'
  workflow_dispatch:

env:
  WORKING_DIR: './infra/terraform'
  TF_ENVIRONMENT: "test"
  TF_REGION: ${{ secrets.TF_REGION }}
  TF_APPNAME: "microservice-store-demo"

jobs:
  security-scan:
    name: "Security Scan: Trivy IaC Analysis"
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Run Trivy vulnerability scanner in IaC mode for Terraform
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: 'config'
          scan-ref: ${{ env.WORKING_DIR }}
          hide-progress: true
          format: 'sarif'
          output: 'trivy-terraform-results.sarif'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-terraform-results.sarif'
          category: terraform-analysis-tool

  plan-infra:
    name: "Provision Low Environment Infrastructure"
    runs-on: ubuntu-latest
    needs: security-scan
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
    outputs:
      tf_exitcode: ${{ steps.plan.outputs.exitcode }}
    steps:
    - name: Checkout https://github.com/${{ github.repository }}@${{ github.ref }}
      uses: actions/checkout@v4
      with:
        persist-credentials: false
    - uses: hashicorp/setup-terraform@v3

    - name: Terraform Init
      run: |
        terraform init \
          -backend-config="bucket=${{ secrets.TF_BUCKET }}" \
          -backend-config="key=${{ secrets.TF_STATE_KEY }}" \
          -backend-config="region=${{ env.TF_REGION }}"
      working-directory: ${{ env.WORKING_DIR }}

    - name: Generate Terraform Plan
      id: plan
      run: |
        terraform plan -detailed-exitcode \
          -var "environment=${{ env.TF_ENVIRONMENT }}" \
          -var "region=${{ env.TF_REGION }}" \
          -var "appname=${{ env.TF_APPNAME }}"
      working-directory: ${{ env.WORKING_DIR }}

  apply-infra:
    environment: test
    name: "Apply Terraform Changes"
    runs-on: ubuntu-latest
    needs: plan-infra
    if: needs.plan-infra.outputs.tf_exitcode == '2'  # applies only if there are any changes
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_BUCKET }}" \
            -backend-config="key=${{ secrets.TF_STATE_KEY }}" \
            -backend-config="region=${{ env.TF_REGION }}"
        working-directory: ${{ env.WORKING_DIR }}

      - name: Apply Terraform Changes
        run: |
          terraform apply -auto-approve \
            -var "environment=${{ env.TF_ENVIRONMENT }}" \
            -var "region=${{ env.TF_REGION }}" \
            -var "appname=${{ env.TF_APPNAME }}"
        working-directory: ${{ env.WORKING_DIR }}