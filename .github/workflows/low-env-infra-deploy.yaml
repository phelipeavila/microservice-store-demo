name: low-env-pipeline

on:
  push:
    branches:
      - 'main'
    paths:
      - 'infra/**'
  workflow_dispatch:

jobs:
  run-trivy-scanner:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout https://github.com/${{ github.repository }}@${{ github.ref }}
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Run Trivy vulnerability scanner in IaC mode for Terraform
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: 'config'
          scan-ref: './infra/terraform'
          hide-progress: true
          format: 'sarif'
          output: 'trivy-terraform-results.sarif'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-terraform-results.sarif'
          category: terraform-analysis-tool

  create-low-env-infra:
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
    steps:
    - name: Criar map com variaveis backend
      run: |
        TF_BACKEND=$(jq -n \
          --arg bucket "${{ secrets.TF_BUCKET }}" \
          --arg key "${{ secrets.TF_STATE_KEY }}" \
          --arg region "${{ secrets.TF_REGION }}" \
          '{key1: $key1, key2: $key2}')
        echo "TF_BACKEND=$TF_BACKEND" >> $GITHUB_ENV
    - uses: hashicorp/setup-terraform@v3
    - run: terraform init -backend-config=$TF_BACKEND
    - run: terraform plan
